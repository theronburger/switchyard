name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Release-scope validation compares the pull request's two parents.
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$PR_TITLE"
      - name: Validate release metadata only
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main--components--switchyard')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SWITCHYARD_BOUNDARY_DENYLIST: ${{ secrets.SWITCHYARD_BOUNDARY_DENYLIST }}
        run: |
          scripts/check-release-pr-scope.sh "$BASE_SHA" "$HEAD_SHA"
          scripts/release-checks.sh
          scripts/check-generic-boundary.sh --require-denylist
      - name: Run production checks
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--branches--main--components--switchyard')
        run: scripts/ci.sh

  boundary:
    name: Generic boundary
    runs-on: macos-26
    # Fork pull requests receive no secrets; they get a skipped scan here and
    # the enforced scan when the change lands on a branch with access.
    env:
      SWITCHYARD_BOUNDARY_DENYLIST: ${{ secrets.SWITCHYARD_BOUNDARY_DENYLIST }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Scan tracked sources (enforced)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: scripts/check-generic-boundary.sh --require-denylist
      - name: Scan tracked sources (fork, best effort)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: scripts/check-generic-boundary.sh

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--branches--main--components--switchyard')
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.0
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: actionlint

  vulnerabilities:
    name: Vulnerability scan
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--branches--main--components--switchyard')
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable code
        run: govulncheck ./...

  secrets:
    name: Secret and history scan
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--branches--main--components--switchyard')
    runs-on: macos-26
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --redact --exit-code 1 --no-banner

  package:
    name: Package universal app
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--branches--main--components--switchyard'))
    needs: [test, boundary, lint, vulnerabilities, secrets]
    runs-on: macos-26
    steps:
      - name: Require prerequisite checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerabilities.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BOUNDARY_RESULT" = success
          test "$LINT_RESULT" = success
          test "$VULNERABILITY_RESULT" = success
          test "$SECRETS_RESULT" = success
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Validate rendered Homebrew Cask
        run: scripts/validate-homebrew-cask.sh
      - name: Build universal dry run
        run: scripts/build-release.sh dist
      - name: Scan the built bundle for consuming-repository identity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SWITCHYARD_BOUNDARY_DENYLIST: ${{ secrets.SWITCHYARD_BOUNDARY_DENYLIST }}
        run: scripts/check-generic-boundary.sh --require-denylist --bundle dist/Switchyard.app
